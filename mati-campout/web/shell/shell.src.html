<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MATI's Campout web shell (Godot custom HTML shell, see tools/export_web.sh).
     Edit shell.src.html, then run tools/export_web.sh (it inlines the font into index.html). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<meta name="description" content="MATI's Campout: a cozy-meets-scary wilderness survival game. Keep the fire alive. Survive the night.">
<meta name="theme-color" content="#0b1024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campout">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="index.180x180.png">
<link rel="icon" type="image/png" href="index.144x144.png">
<style>
@font-face {
	font-family: "Fredoka";
	font-weight: 700;
	font-display: swap;
	src: url(data:font/woff2;base64,/*FREDOKA_700_BASE64*/) format("woff2");
}
:root {
	--night: #0b1024;
	--indigo: #232a5c;
	--amber: #ffb347;
	--orange: #e8892b;
	--cream: #fff1d6;
	--muted: #cdbf9e;
}
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background: var(--night);
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
body {
	position: fixed;
	inset: 0;
	color: var(--cream);
	font-family: "Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#canvas {
	display: block;
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	outline: none;
	background: var(--night);
}
#canvas:focus { outline: none; }
/* Measures the notch / home-bar insets for the game (window.matiSafeArea). */
#safe-probe {
	position: fixed;
	inset: 0;
	pointer-events: none;
	visibility: hidden;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

/* ---------- Boot screen ---------- */
#boot {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: min(2.2vh, 18px);
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
	box-sizing: border-box;
	text-align: center;
	background:
		radial-gradient(ellipse 60% 45% at 50% 105%, rgba(255, 140, 50, 0.28), rgba(255, 140, 50, 0) 70%),
		radial-gradient(ellipse 120% 80% at 50% 0%, #1b2350 0%, #0b1024 62%);
	transition: opacity 0.7s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
.stars, .stars::after {
	position: absolute;
	inset: 0;
	pointer-events: none;
	background-image:
		radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
		radial-gradient(1px 1px at 27% 8%, #dfe6ff 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 43% 26%, #fff 50%, transparent 51%),
		radial-gradient(1px 1px at 61% 12%, #cfd8ff 50%, transparent 51%),
		radial-gradient(2px 2px at 78% 22%, #fff 50%, transparent 51%),
		radial-gradient(1px 1px at 88% 9%, #e8ecff 50%, transparent 51%),
		radial-gradient(1px 1px at 7% 40%, #dfe6ff 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 93% 38%, #fff 50%, transparent 51%),
		radial-gradient(1px 1px at 35% 44%, #cfd8ff 50%, transparent 51%),
		radial-gradient(1px 1px at 70% 46%, #fff 50%, transparent 51%);
	animation: twinkle 4s ease-in-out infinite alternate;
}
.stars::after { content: ""; transform: translate(3%, 4%); animation-delay: -2s; opacity: 0.7; }
@keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }
.trees {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 18vh;
	pointer-events: none;
}
.fire {
	position: relative;
	width: min(22vh, 150px);
	height: min(22vh, 150px);
	flex: none;
}
.fire .glow {
	position: absolute;
	inset: -45%;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(255, 170, 70, 0.55) 0%, rgba(232, 137, 43, 0.22) 38%, rgba(232, 137, 43, 0) 68%);
	animation: glow 2.4s ease-in-out infinite alternate;
}
@keyframes glow { from { transform: scale(0.94); opacity: 0.85; } to { transform: scale(1.06); opacity: 1; } }
.fire svg { position: relative; width: 100%; height: 100%; overflow: visible; }
.flame { transform-origin: 64px 92px; animation: flicker 0.9s ease-in-out infinite alternate; }
.flame.inner { animation-duration: 0.6s; animation-delay: -0.3s; }
@keyframes flicker {
	0% { transform: scale(1, 1) skewX(0deg); }
	50% { transform: scale(0.96, 1.06) skewX(-2deg); }
	100% { transform: scale(1.03, 0.95) skewX(2deg); }
}
.ember { animation: rise 2.2s linear infinite; opacity: 0; }
.ember.e2 { animation-delay: -0.8s; }
.ember.e3 { animation-delay: -1.5s; }
@keyframes rise {
	0% { transform: translate(0, 0); opacity: 0; }
	15% { opacity: 1; }
	100% { transform: translate(6px, -46px); opacity: 0; }
}
h1 {
	margin: 0;
	font-weight: 700;
	line-height: 1;
	font-size: clamp(34px, 9vh, 76px);
	color: var(--cream);
	text-shadow: 0 0 26px rgba(255, 170, 70, 0.45), 0 4px 0 rgba(60, 25, 10, 0.6);
	letter-spacing: 0.01em;
}
h1 .mati { color: var(--amber); }
.tagline {
	margin: 0;
	font-size: clamp(14px, 2.9vh, 22px);
	color: #f2e4c4;
	opacity: 0.92;
}
.progress {
	width: min(72vw, 460px);
	height: 18px;
	border-radius: 999px;
	background: rgba(14, 26, 20, 0.85);
	border: 2px solid rgba(255, 179, 71, 0.35);
	box-shadow: 0 0 18px rgba(255, 140, 50, 0.18), inset 0 2px 6px rgba(0, 0, 0, 0.5);
	overflow: hidden;
	box-sizing: border-box;
}
.progress .fill {
	height: 100%;
	width: 3%;
	border-radius: 999px;
	background: linear-gradient(90deg, #e8642b, #ffb347 60%, #ffd166);
	box-shadow: 0 0 12px rgba(255, 179, 71, 0.75);
	transition: width 0.25s ease;
}
.progress.busy .fill {
	width: 40% !important;
	animation: busy 1.3s ease-in-out infinite alternate;
}
@keyframes busy { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
.status {
	margin: 0;
	min-height: 1.3em;
	font-size: clamp(13px, 2.5vh, 18px);
	color: var(--muted);
}
#start {
	display: none;
	align-items: center;
	gap: 12px;
	padding: 0.5em 1.4em 0.5em 1.1em;
	font: inherit;
	font-weight: 700;
	font-size: clamp(24px, 6vh, 40px);
	color: #2a1406;
	background: linear-gradient(180deg, #ffc76a, #e8892b);
	border: 3px solid #ffe2a8;
	border-radius: 999px;
	box-shadow: 0 0 0 6px rgba(255, 179, 71, 0.18), 0 10px 26px rgba(0, 0, 0, 0.45), 0 0 44px rgba(255, 150, 60, 0.45);
	cursor: pointer;
	touch-action: manipulation;
	animation: pulse 1.6s ease-in-out infinite;
}
#start.show { display: inline-flex; }
#start:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
#start svg { width: 1.1em; height: 1.1em; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.hint {
	margin: 0;
	font-size: clamp(12px, 2.2vh, 16px);
	color: rgba(205, 191, 158, 0.85);
}
.rotate {
	display: none;
	align-items: center;
	gap: 10px;
	padding: 8px 16px;
	border-radius: 999px;
	background: rgba(255, 179, 71, 0.12);
	border: 1px solid rgba(255, 179, 71, 0.3);
	color: var(--amber);
	font-size: 16px;
}
.rotate svg { width: 26px; height: 26px; animation: turn 2.6s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) {
	.rotate { display: inline-flex; }
}
#notice {
	display: none;
	max-width: min(86vw, 560px);
	padding: 16px 20px;
	border-radius: 16px;
	background: rgba(60, 20, 20, 0.85);
	border: 2px solid rgba(255, 107, 74, 0.6);
	color: #ffe4d6;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	font-size: 15px;
	line-height: 1.45;
	white-space: pre-line;
}
#notice.show { display: block; }
@media (max-height: 420px) {
	.fire { width: 17vh; height: 17vh; }
	#boot { gap: 1.6vh; }
	.tagline { display: none; }
}
@media (prefers-reduced-motion: reduce) {
	.stars, .stars::after, .flame, .ember, .fire .glow, #start, .rotate svg { animation: none; }
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>

<div id="safe-probe"></div>
<noscript><p style="padding:24px;color:#fff1d6;font-family:sans-serif">MATI's Campout needs JavaScript to run.</p></noscript>

<div id="boot" role="dialog" aria-label="MATI's Campout is loading">
	<div class="stars"></div>
	<svg class="trees" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,100 0.0,90.8 11.6,53.9 23.2,95.4 16.5,91.9 28.4,58.9 40.3,95.7 32.7,92.6 42.3,57.1 51.8,89.4 43.9,88.4 54.7,28.1 65.5,91.4 58.4,89.1 75.2,59.5 92.0,93.7 78.3,89.5 88.2,45.3 98.2,94.6 92.7,91.6 106.8,41.9 120.9,95.5 108.7,92.6 119.4,25.3 130.0,93.5 124.2,89.6 136.8,45.8 149.4,90.4 139.9,89.0 153.5,33.6 167.1,90.2 157.2,92.7 174.1,55.6 190.9,89.9 177.3,90.7 190.2,59.9 203.1,89.9 195.9,90.4 211.9,45.1 227.9,91.2 219.1,88.4 231.8,16.6 244.4,92.2 238.1,90.8 247.5,24.1 257.0,88.1 253.2,90.7 264.4,41.2 275.7,95.8 268.7,95.5 279.0,55.7 289.4,89.9 280.9,89.0 291.9,40.9 302.8,95.4 295.9,89.4 309.3,14.3 322.7,89.1 312.9,88.9 325.2,42.6 337.5,88.3 327.6,94.1 338.0,49.5 348.4,92.1 342.7,92.6 353.8,61.8 364.9,93.0 358.7,91.9 375.3,24.7 391.9,91.1 383.7,89.8 393.1,13.4 402.6,89.0 398.6,95.2 410.7,40.5 422.9,90.9 412.4,94.7 421.9,50.7 431.5,93.3 423.2,95.2 432.2,53.8 441.2,93.1 433.2,94.8 449.2,28.8 465.2,94.0 454.2,89.2 466.1,55.4 478.0,88.1 470.6,95.2 483.5,57.4 496.3,93.3 486.8,95.8 502.4,53.3 518.1,88.4 509.0,95.8 519.1,32.7 529.3,91.8 526.1,93.9 542.0,24.4 557.9,93.1 545.2,89.8 560.4,33.2 575.6,93.4 563.9,89.2 579.4,8.8 594.9,89.6 588.6,91.9 603.5,49.8 618.4,93.2 605.2,93.9 614.5,46.9 623.7,90.5 620.7,88.1 633.3,11.4 645.8,88.4 637.3,94.4 648.0,49.8 658.8,94.4 653.1,92.2 669.3,16.6 685.6,90.8 678.7,88.7 688.4,26.3 698.1,89.7 693.7,89.7 706.6,52.4 719.4,93.3 714.0,92.8 730.8,40.6 747.6,88.4 739.8,94.8 750.1,55.1 760.5,88.8 756.2,88.2 766.3,17.4 776.5,90.7 769.5,95.9 782.9,54.9 796.3,88.2 789.4,92.5 802.7,11.6 815.9,89.0 810.5,93.7 821.2,48.4 831.9,94.1 826.0,95.0 837.1,39.4 848.2,88.7 840.6,88.8 853.2,30.5 865.9,92.6 861.5,91.8 874.5,33.3 887.5,95.9 879.2,89.6 889.7,61.8 900.2,94.6 893.7,93.4 908.5,32.0 923.3,91.9 914.9,91.5 930.2,56.3 945.5,94.0 934.3,91.5 949.4,34.6 964.6,89.9 959.3,92.0 971.8,28.9 984.4,91.9 978.3,92.2 990.9,33.2 1003.5,88.5 997.5,93.9 1013.5,11.1 1029.5,91.5 1000,100" fill="#070c1a"/></svg>
	<div class="fire" aria-hidden="true">
		<div class="glow"></div>
		<svg viewBox="0 0 128 128">
			<path class="flame" d="M64 30 C80 50 90 62 84 82 C79 98 49 98 44 82 C39 66 50 58 53 44 C56 54 61 58 64 30 Z" fill="#ff9a3c"/>
			<path class="flame" d="M64 46 C74 60 80 68 76 84 C73 94 55 94 52 84 C49 74 56 68 58 58 C60 64 63 66 64 46 Z" fill="#ffcf5a"/>
			<path class="flame inner" d="M64 64 C69 72 71 78 69 86 C67 91 60 91 58 86 C57 81 60 77 64 64 Z" fill="#fff2b0"/>
			<rect x="38" y="92" width="52" height="9" rx="4.5" fill="#6b4226" transform="rotate(12 64 96)"/>
			<rect x="38" y="92" width="52" height="9" rx="4.5" fill="#7d4f2e" transform="rotate(-12 64 96)"/>
			<circle class="ember" cx="60" cy="40" r="2" fill="#ffd166"/>
			<circle class="ember e2" cx="70" cy="44" r="1.6" fill="#ffb347"/>
			<circle class="ember e3" cx="64" cy="36" r="1.4" fill="#ffe2a8"/>
		</svg>
	</div>
	<h1><span class="mati">MATI's</span> Campout</h1>
	<p class="tagline">Keep the fire alive. Survive the night.</p>
	<div class="progress" id="progress"><div class="fill" id="fill"></div></div>
	<p class="status" id="status">Gathering firewood...</p>
	<button id="start" type="button">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3 4 5 6.5 4 10.5C15.2 16 8.8 16 8 12.5 7.4 10 9.2 8.4 10 6c.6 1.8 1.4 2.6 2-4z" fill="#7a2e08"/><path d="M5 19.5l14-3M5 16.5l14 3" stroke="#5a3418" stroke-width="2.4" stroke-linecap="round"/></svg>
		<span id="start-label">Tap to start</span>
	</button>
	<p class="hint" id="hint">Sound on! Best played in landscape.</p>
	<div class="rotate" id="rotate">
		<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.2" fill="none" stroke="#ffb347" stroke-width="2"/><circle cx="12" cy="17.5" r="1" fill="#ffb347"/></svg>
		<span>Turn your phone sideways</span>
	</div>
	<div id="notice" role="alert"></div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	'use strict';
	const byId = (id) => document.getElementById(id);
	const boot = byId('boot');
	const progress = byId('progress');
	const fill = byId('fill');
	const statusEl = byId('status');
	const startBtn = byId('start');
	const notice = byId('notice');
	const probe = byId('safe-probe');
	const canvas = byId('canvas');
	const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

	// Notch / home-indicator insets in CSS px, read by the game (core/platform.gd).
	window.matiSafeArea = function () {
		const cs = getComputedStyle(probe);
		return {
			top: parseFloat(cs.paddingTop) || 0,
			right: parseFloat(cs.paddingRight) || 0,
			bottom: parseFloat(cs.paddingBottom) || 0,
			left: parseFloat(cs.paddingLeft) || 0,
		};
	};
	if (!coarse) {
		byId('start-label').textContent = 'Click to start';
		byId('hint').textContent = 'Sound on! Press Enter or click to light the fire.';
	}
	canvas.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('gesturestart', (e) => e.preventDefault());

	const lines = ['Gathering firewood...', 'Pitching the tent...', 'Waking the fireflies...', 'Counting the stars...', 'Sharpening the axe...'];
	let lineIdx = 0;
	const lineTimer = setInterval(function () {
		if (state !== 'loading') {
			return;
		}
		lineIdx = (lineIdx + 1) % lines.length;
		statusText = lines[lineIdx];
		render();
	}, 2600);

	let state = 'loading';
	let statusText = lines[0];
	let percent = 0;

	function render() {
		if (state === 'loading') {
			statusEl.textContent = statusText + (percent > 0 ? '  ' + percent + '%' : '');
		}
	}

	function fail(err) {
		console.error(err);
		state = 'error';
		clearInterval(lineTimer);
		progress.style.display = 'none';
		startBtn.classList.remove('show');
		statusEl.textContent = 'Oh no, the campfire would not light.';
		let msg = (err instanceof Error) ? err.message : String(err || 'Unknown error');
		notice.textContent = msg + '\nTry reloading the page. MATI\'s Campout needs a browser with WebGL 2 (recent Chrome, Edge, Firefox or Safari).';
		notice.classList.add('show');
	}

	function hideBoot() {
		if (state === 'gone') {
			return;
		}
		state = 'gone';
		clearInterval(lineTimer);
		boot.classList.add('gone');
		setTimeout(function () { boot.remove(); }, 800);
		canvas.focus();
	}
	// Called from the game (main.gd) once the title screen is up.
	window.matiGameReady = hideBoot;
	// QA: memory of the running engine (wasm heap) for browser tests.
	window.matiWasmBytes = function () {
		try {
			return engine.rtenv ? engine.rtenv['HEAP8'].buffer.byteLength : 0;
		} catch (e) {
			return -1;
		}
	};

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('Your browser is missing:\n' + missing.join('\n')));
		return;
	}
	try {
		const gl = document.createElement('canvas').getContext('webgl2');
		if (!gl) {
			fail(new Error('WebGL 2 is not available (it may be switched off in your browser settings).'));
			return;
		}
	} catch (e) {
		// Let the engine report it.
	}

	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				percent = Math.min(100, Math.round(current * 100 / total));
				fill.style.width = Math.max(3, percent) + '%';
				render();
			}
		},
	}));
	const exe = GODOT_CONFIG['executable'];
	const pack = GODOT_CONFIG['mainPack'] || (exe + '.pck');
	const autostart = /[?&]autostart\b/.test(location.search);

	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		state = 'ready';
		clearInterval(lineTimer);
		fill.style.width = '100%';
		statusEl.textContent = 'The fire is ready!';
		startBtn.classList.add('show');
		startBtn.focus({ preventScroll: true });
		if (autostart) {
			begin();
		}
	}, fail);

	function lockLandscape() {
		try {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		} catch (e) { /* not supported */ }
	}

	function begin() {
		if (state !== 'ready') {
			return;
		}
		state = 'starting';
		startBtn.classList.remove('show');
		progress.classList.add('busy');
		statusEl.textContent = 'Lighting the fire...';
		// Phones: go fullscreen and hold landscape where the browser allows it
		// (Android Chrome; iPhone Safari keeps its bars - Add to Home Screen hides them).
		if (coarse) {
			try {
				const el = document.documentElement;
				const req = el.requestFullscreen || el.webkitRequestFullscreen;
				if (req) {
					const p = req.call(el, { navigationUI: 'hide' });
					if (p && p.then) {
						p.then(lockLandscape).catch(function () {});
					}
				}
			} catch (e) { /* ignore */ }
		}
		// QA: index.html?godot_args=--quality=phone%20--touch passes extra engine args.
		const qa = new URLSearchParams(location.search).get('godot_args');
		const extra = qa ? ['--'].concat(qa.split(' ').filter(Boolean)) : [];
		engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args'] || [], extra) }).then(function () {
			// Safety net in case the game never reports in.
			setTimeout(hideBoot, 25000);
		}, fail);
	}
	startBtn.addEventListener('click', begin);
	document.addEventListener('keydown', function (e) {
		if (state === 'ready' && (e.key === 'Enter' || e.key === ' ')) {
			e.preventDefault();
			begin();
		}
	});
}());
</script>
</body>
</html>
